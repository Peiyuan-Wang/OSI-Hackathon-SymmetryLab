[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "symmetrylab"
version = "0.3.0"
description = "Verifiable counterexample-driven research on torus affine symmetries"
requires-python = ">=3.11"
dependencies = ["sympy==1.14.0"]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]
# PhysBERT encoder for the paper survey (pulls in PyTorch; model ~440 MB, downloaded only on request)
physics = ["sentence-transformers==6.2.0"]
# Native window for the desktop app (pinned set in requirements-desktop.lock)
desktop = ["pywebview==6.2.1"]

[project.scripts]
symmetrylab = "symmetrylab.cli:main"

[project.gui-scripts]
symmetrylab-app = "symmetrylab.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
"symmetrylab.web" = ["static/*"]
